<html lang="es">

<title>Click Here :3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Layout: una sola pantalla centrada, cada paso reemplaza al anterior. Diseño de un solo tema a propósito (rosa suave). */
  :root {
    --bg: #ffe3ef;
    --bg-2: #ffc4dd;
    --ink: #4a1d33;
    --pink: #ff6fa5;
    --pink-dark: #d94a82;
    --cream: #fff8f2;
    --font: "Fredoka", "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(160deg, var(--bg), var(--bg-2));
    color: var(--ink);
    font-family: var(--font);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 480px; text-align: center; display: grid; gap: 24px; justify-items: center; }
  h1 { margin: 0; font-size: clamp(2.4rem, 11vw, 4rem); font-weight: 700; letter-spacing: .02em; text-wrap: balance; line-height: 1.05; }
  h2 { margin: 0; font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 600; text-wrap: balance; line-height: 1.15; }
  p { margin: 0; font-size: 1.2rem; }

  button {
    font: inherit; cursor: pointer; border: 0; color: #fff; background: var(--pink);
    border-radius: 999px; padding: .7em 1.6em; font-weight: 600; font-size: 1.4rem;
    box-shadow: 0 6px 0 var(--pink-dark);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-dark); }
  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .face-btn { font-size: clamp(3.5rem, 18vw, 6rem); padding: .3em .7em; line-height: 1; animation: bob 1.6s ease-in-out infinite; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .btn-no { background: #fff; color: var(--ink); box-shadow: 0 6px 0 #e3bccf; }
  .btn-no:active { box-shadow: 0 2px 0 #e3bccf; }
  .link { background: none; box-shadow: none; color: var(--pink-dark); font-size: 1rem; text-decoration: underline; padding: .3em .6em; }
  .link:active { transform: none; box-shadow: none; }

  .dog { width: min(320px, 78vw); height: auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(74,29,51,.28); animation: bounce .7s ease-in-out infinite; transform-origin: 50% 100%; }
  .sad { width: min(300px, 76vw); height: auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(74,29,51,.28); }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .heart { position: absolute; bottom: -40px; font-size: 28px; color: var(--pink); animation: rise linear forwards; }

  .screen { display: grid; gap: 24px; justify-items: center; animation: pop .35s ease-out; }


  .pets { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .pet { position: absolute; width: clamp(64px, 17vw, 110px); height: auto; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(74,29,51,.28)); }
  .pet:nth-child(2n) { animation-duration: 2.8s; animation-delay: -.8s; }
  .pet:nth-child(3n) { animation-duration: 2.5s; animation-delay: -1.4s; }
  main { position: relative; z-index: 2; }

  .pet { pointer-events: auto; cursor: pointer; }
  .sad { cursor: pointer; transition: opacity .25s ease; }
  .sad.boom { animation: shake .35s linear, flash .6s ease-out; }
  .sad.gone { opacity: 0; }
  .hint { font-size: 1rem; opacity: .85; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  @keyframes shake { 0%,100% { transform: translate(0); } 20% { transform: translate(-6px, 3px) rotate(-2deg); } 40% { transform: translate(6px, -3px) rotate(2deg); } 60% { transform: translate(-5px, -2px); } 80% { transform: translate(5px, 2px); } }
  @keyframes flash { 0% { filter: brightness(2.2) sepia(1) saturate(6) hue-rotate(-20deg); } 100% { filter: none; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes bounce { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-10px) scale(1.02,.98); } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  @keyframes rise { from { transform: translateY(0) rotate(0); opacity: 1; } to { transform: translateY(-110vh) rotate(40deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .face-btn, .dog, .screen, .heart, .pet { animation: none; }
  }
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
  var ids = ["s1", "s2", "s-yes", "s-no"];
  function show(id) {
    ids.forEach(function (x) { document.getElementById(x).hidden = (x !== id); });
    document.getElementById("pets").hidden = (id !== "s-yes");
  }
  function burst() {
    var box = document.getElementById("hearts");
    for (var i = 0; i < 24; i++) {
      var h = document.createElement("span");
      h.className = "heart";
      h.textContent = "♥";
      h.style.left = Math.random() * 100 + "%";
      h.style.fontSize = 18 + Math.random() * 28 + "px";
      h.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
      h.style.animationDelay = Math.random() * 0.8 + "s";
      box.appendChild(h);
      setTimeout(function (el) { el.remove(); }, 6500, h);
    }
  }
  document.getElementById("face").addEventListener("click", function () { show("s2"); });
  document.getElementById("yes").addEventListener("click", function () { show("s-yes"); burst(); setTimeout(confettiFromPets, 80); });
  document.getElementById("no").addEventListener("click", function () { show("s-no"); });
  document.querySelectorAll("[data-back]").forEach(function (b) {
    b.addEventListener("click", function () { show(b.closest("#s-yes") ? "s1" : "s2"); });
  });

  /* Efectos: confeti desde los pibbles y fuego al tocar al bebé */
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d"), parts = [], running = false;
  function fit() {
    var d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  fit(); addEventListener("resize", fit);
  var COLORS = ["#ff3d7f", "#ffe14a", "#3ddcff", "#7cff6b", "#ffffff", "#ff9a3d", "#b983ff"];
  function confetti(x, y) {
    for (var i = 0; i < 50; i++) {
      var a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
      parts.push({ k: "c", x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, g: 0.22,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        life: 110 + Math.random() * 60, max: 170, col: COLORS[(Math.random() * COLORS.length) | 0] });
    }
    run();
  }
  function fire(x, y) {
    for (var i = 0; i < 120; i++) {
      var a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 9;
      parts.push({ k: "f", x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: -0.06,
        s: 10 + Math.random() * 22, life: 40 + Math.random() * 40, max: 80, hue: 8 + Math.random() * 45 });
    }
    run();
  }
  function run() { if (!running) { running = true; requestAnimationFrame(tick); } }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
      if (p.k === "c") {
        p.vx *= 0.99; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.min(1, p.life / 40); ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      } else {
        var t = p.life / p.max, r = p.s * (0.4 + t * 0.6);
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = t;
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, "hsla(" + (p.hue + 30) + ",100%,70%,1)");
        g.addColorStop(0.5, "hsla(" + p.hue + ",100%,50%,.8)");
        g.addColorStop(1, "hsla(0,100%,40%,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill(); ctx.restore();
      }
    });
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function center(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  function confettiFromPets() {
    document.querySelectorAll(".pet").forEach(function (el, i) {
      setTimeout(function () { var c = center(el); confetti(c[0], c[1]); }, i * 90);
    });
  }
  document.querySelectorAll(".pet").forEach(function (el) {
    el.addEventListener("click", function () { var c = center(el); confetti(c[0], c[1]); });
  });
  var sad = document.querySelector(".sad");
  sad.addEventListener("click", function () {
    if (sad.classList.contains("gone")) return;
    var c = center(sad);
    sad.classList.add("boom");
    setTimeout(function () { fire(c[0], c[1]); sad.classList.add("gone"); }, 250);
    setTimeout(function () { fire(c[0], c[1]); }, 420);
    setTimeout(function () { sad.classList.remove("boom", "gone"); }, 2300);
  });
</script>
